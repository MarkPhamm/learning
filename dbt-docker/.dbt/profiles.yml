profiles_dbt_docker:
  target: "{{ env_var('DBT_TARGET', 'dbt_duckdb_dev') }}"
  outputs:
    dbt_snowflake_dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/root/.ssh/snowflake_key.p8') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'transforming') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'analytics') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'dbt') }}"
      threads: 4

    dbt_duckdb_dev:
      type: duckdb
      path: /utils/analytics.duckdb
      schema: analytics
      threads: 4
      attach:
        - path: /utils/raw.duckdb
          alias: raw
          read_only: true
